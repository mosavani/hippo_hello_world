# service-settings/default/values.yml
# Dev / staging baseline — merged on top of helm/hippo-hello-world/values.yaml

global:
  env: dev

service:
  replicaCount: 2
  type: ClusterIP
  port: 80
  targetPort: 8080
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 3
  readiness:
    enabled: true
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3

metrics:
  enabled: true
  port: 8080
  path: /metrics

ingress:
  enabled: true
  className: "gce"
  annotations:
    kubernetes.io/ingress.allow-http: "false"
  # host: omitted — inherits default from Helm chart
  path: /

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50
  scaleDownStabilizationWindowSeconds: 300

pdb:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity: soft

networkPolicy:
  enabled: true
  ingressNamespace: kube-system

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

env:
  - name: PORT
    value: "8080"
  - name: APP_ENV
    value: development
  - name: STARTUP_DELAY_SECONDS
    value: "0"
