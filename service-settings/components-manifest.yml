# service-settings/components-manifest.yml
#
# This is the only file a developer edits for deployment configuration.
# The platform ApplicationSet (hippo_k8s-service/argocd/applicationset.yaml)
# reads this file and generates all ArgoCD Applications automatically.
#
# Fields are top-level (no wrapping array) so ArgoCD's git file generator
# can read them directly as template variables.
#
#   name                — Helm release name and ArgoCD Application prefix
#                         Also used by the platform to construct the image path:
#                         <GAR_LOCATION>-docker.pkg.dev/<GAR_PROJECT_ID>/<GAR_REPOSITORY>/<name>
#   repo_url            — Git repo URL for this service
#   target_revision     — Git ref (HEAD, or pin to a tag for prod stability)
#   image_tag           — Image tag to deploy (updated by CI on release)
#   default_values      — Values file path for dev/staging
#   prod_values         — Values file path for production overrides

app_name: hippo-hello-world
repo_url: https://github.com/mosavani/hippo_hello_world.git
target_revision: HEAD
image_tag: "0.0.19"
default_values: service-settings/default/values.yml
prod_values: service-settings/overrides/values.yml
# deployment_type controls the rollout strategy:
#   rolling     — standard Kubernetes Deployment (default, no extra controller needed)
#   progressive — Argo Rollout with canary steps and analysis (requires Argo Rollouts)
deployment_type: progressive
