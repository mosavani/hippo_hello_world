# service-settings/overrides/values.yml
# Production overrides — merged last, highest precedence

global:
  env: prod

service:
  replicaCount: 2
  liveness:
    periodSeconds: 60
  readiness:
    periodSeconds: 30

hpa:
  minReplicas: 4
  maxReplicas: 50
  targetCPUUtilizationPercentage: 60

rollout:
  # Tighter thresholds and longer pauses for production safety.
  analysis:
    defaultCpuUsage:
      threshold: 60
    defaultMemoryUtilization:
      threshold: 70
  steps:
    - setWeight: 5
    - pause:
        duration: 5m
    - setWeight: 20
    - pause:
        duration: 5m
    - setWeight: 50
    - pause:
        duration: 10m
    - setWeight: 75
    - pause:
        duration: 10m
    - setWeight: 100
    - pause:
        duration: 5m

affinity:
  podAntiAffinity: hard             # Hard HA in production

# pdb:
#   minAvailable: 2

ingress:
  # host: omitted — inherits default from Helm chart
  annotations:
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: hippo-hello-world-cert

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 512Mi

env:
  - name: PORT
    value: "8080"
  - name: APP_ENV
    value: production
  - name: STARTUP_DELAY_SECONDS
    value: "0"
