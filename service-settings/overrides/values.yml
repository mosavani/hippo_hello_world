# service-settings/overrides/values.yml
# Production overrides — merged last, highest precedence

global:
  env: prod

service:
  replicaCount: 5
  liveness:
    periodSeconds: 60
  readiness:
    periodSeconds: 30

hpa:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60   # scale UP when CPU > 60%
  scaleDownCPUThreshold: 20            # scale DOWN only when CPU < 20%
  scaleDownStabilizationWindowSeconds: 120  # must stay below for 2m before scaling down

rollout:
  # Tighter thresholds and longer pauses for production safety.
  analysis:
    defaultCpuUsage:
      threshold: 60
    defaultMemoryUtilization:
      threshold: 70
  steps:
    - setWeight: 5
    - pause:
        duration: 5m
    - setWeight: 20
    - pause:
        duration: 5m
    - setWeight: 50
    - pause:
        duration: 10m
    - setWeight: 75
    - pause:
        duration: 10m
    - setWeight: 100
    - pause:
        duration: 5m

# affinity:
#   podAntiAffinity: hard             # Hard HA in production

# pdb:
#   minAvailable: 2

ingress:
  # host: omitted — inherits default from Helm chart
  annotations:
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: hippo-hello-world-cert

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 512Mi

env:
  - name: PORT
    value: "8080"
  - name: APP_ENV
    value: production
  - name: STARTUP_DELAY_SECONDS
    value: "0"
