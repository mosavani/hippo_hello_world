# .github/workflows/release.yml
# Triggered by pushing a semver tag (e.g. v1.2.3).
#
# Steps:
#   1. Build and push Docker image to Google Artifact Registry (GAR)
#   2. Update image_tag in service-settings/components-manifest.yml
#   3. Commit and push the manifest update back to main
#      → ArgoCD detects the change and deploys automatically
#
# Authentication: Workload Identity Federation — no long-lived keys.
# The GCP SA and WIF binding are declared in hippo_cloud/environments/dev/wif.yml
# under github_ci and managed by Terraform.
#
# Required repository secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER — WIF provider resource name
#                                    (from: terraform -chdir=environments/dev output -raw wif_provider)
#   GCP_SERVICE_ACCOUNT            — SA email for hippo-image-publisher (org-scoped, covers all service repos)
#                                    (from: terraform -chdir=environments/dev output github_ci_service_accounts["hippo-image-publisher"])
#   GAR_LOCATION                   — e.g. us-central1
#   GAR_PROJECT_ID                 — GCP project ID
#   GAR_REPOSITORY                 — AR repository name (e.g. hippo-images)
#
# Required repository permissions (Settings → Actions → General):
#   contents: write   — to commit the manifest update back to main

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write    # commit manifest update back to main
  id-token: write    # required for WIF token exchange

jobs:
  release:
    name: Build, Push & Update Manifest
    runs-on: ubuntu-latest

    env:
      GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
      GAR_PROJECT_ID: ${{ secrets.GAR_PROJECT_ID }}
      GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
      MANIFEST: service-settings/components-manifest.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Checkout main so we can commit the manifest update back to it.
          # The tag trigger checks out a detached HEAD by default.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # Strip leading 'v' from tag → image version (e.g. v1.2.3 → 1.2.3)
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Derive full image path from GAR secrets
      - name: Resolve image repo
        id: image
        run: |
          echo "repo=${GAR_LOCATION}-docker.pkg.dev/${GAR_PROJECT_ID}/${GAR_REPOSITORY}/hippo-hello-world" \
            >> "$GITHUB_OUTPUT"

      # ── Auth ─────────────────────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker credential helper for GAR
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      # ── Docker ───────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Update components-manifest.yml ───────────────────────────────────
      # Writes the new image_tag into the manifest so ArgoCD picks it up.
      - name: Update image_tag in components-manifest.yml
        run: |
          sed -i "s|image_tag:.*|image_tag: \"${{ steps.version.outputs.version }}\"|" \
            ${{ env.MANIFEST }}

      - name: Commit and push manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST }}
          git commit -m "chore: bump image_tag to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin main

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "### Release ${{ steps.version.outputs.version }} published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Docker image:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.repo }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Manifest updated:** \`${{ env.MANIFEST }}\` → image_tag: \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ArgoCD will deploy \`hippo-hello-world-dev\` automatically." >> "$GITHUB_STEP_SUMMARY"
          echo "\`hippo-hello-world-prod\` requires a manual sync." >> "$GITHUB_STEP_SUMMARY"
